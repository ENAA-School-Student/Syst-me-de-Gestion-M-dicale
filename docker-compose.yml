version: '3.8'

services:

  app:
    build: .
    container_name: healthcare-app

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthcare?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_FLYWAY_ENABLED: true

      JWT_SECRET: mySecretKeymySecretKeymySecretKey123456
      JWT_EXPIRATION: 3600000

    depends_on:
      db:
        condition: service_healthy

    networks:
      - healthcare-network

  db:
    image: mysql:8.0

    container_name: healthcare-db

    restart: always

    ports:
      - "3308:3306"

    environment:
      MYSQL_DATABASE: healthcare
      MYSQL_ROOT_PASSWORD: password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - healthcare-network

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  healthcare-network:
    driver: bridge

volumes:
  mysql_data: