spring.application.name=HealthCare
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:healthcare}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=mysupersecretkeymysupersecretkey123456
jwt.expiration=3600000

# Redis connection configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Cache type
spring.cache.type=redis
# Cache TTL (10 minutes in milliseconds)
spring.cache.redis.time-to-live=600000
